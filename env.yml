name: pykumu-causal-analysis
# Note: Java is intentionally not installed by conda here.
# Install a system JDK 21 (Corretto 21 recommended) and ensure JAVA_HOME/PATH are set.
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - ipykernel
  - jupyterlab
  - numpy
  - pandas
  - jpype1
  - networkx
  - pydot
  - graphviz
  - python-graphviz
  # Uses system JDK (Corretto 21) via JAVA_HOME/PATH 
  - pip:
      - notebook
